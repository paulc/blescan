[package]
name = "blescan"
version = "0.5.1"
edition = "2024"

[lib]
name = "blescan"
path = "src/lib.rs"

[[bin]]
name = "blescan"
path = "src/bin/main.rs"

[features]
mqtt = ["rquickjs_utils/mqtt"]

[dependencies]
anyhow = "1.0.102"
argh = "0.1.19"
btleplug = "0.12.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.32"
hex = "0.4.3"
regex = "1.12.3"
rquickjs = { version = "0.12.0", features = ["futures"] }
rquickjs_utils = { git = "https://github.com/paulc/rquickjs_utils", version = "0.3.3" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
uuid = { version = "1.23.0", features = ["serde", "v4"] }

[build-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
uuid = { version = "1.24.0", features = ["v4"] }
