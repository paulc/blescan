<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blescan sse</title>
<style>
:root { --fg: #222; --bg: #fff; --muted: #666; --border: #ccc; --panel: #f6f6f6; --accent: #1565c0; --ok: #2e7d32; --err: #c62828; }
@media (prefers-color-scheme: dark) {
  :root { --fg: #ddd; --bg: #1b1b1b; --muted: #999; --border: #444; --panel: #252525; --accent: #64b5f6; --ok: #81c784; --err: #e57373; }
}
body { font-family: system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0; padding: 12px 16px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
h1 { font-size: 1.3em; margin: 0; }
a { color: var(--accent); }
code { font-size: 12px; }
#req { color: var(--muted); font-family: monospace; font-size: 12px; margin: 6px 0; word-break: break-all; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 6px 0; }
.controls input[type=text] { flex: 1; min-width: 160px; }
input, button { font: inherit; padding: 4px 8px; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; }
input[type=number] { width: 6em; }
button { cursor: pointer; background: var(--panel); }
.ok { color: var(--ok); font-weight: 600; }
.err { color: var(--err); font-weight: 600; }
#wrap { flex: 1; overflow: auto; border: 1px solid var(--border); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { position: sticky; top: 0; background: var(--panel); text-align: left; cursor: default; white-space: nowrap; }
th.sort { cursor: pointer; }
th, td { border-bottom: 1px solid var(--border); padding: 3px 6px; vertical-align: top; }
td { font-family: monospace; font-size: 12px; max-width: 40em; word-break: break-all; }
tr.data { cursor: pointer; }
tr.data:hover { background: var(--panel); }
tr.detail pre { margin: 0; white-space: pre-wrap; }
td .svc { white-space: nowrap; }
td .chr { padding-left: 1em; word-break: normal; }
td .muted { color: var(--muted); }
.act { font-family: system-ui, sans-serif; font-size: 11px; padding: 0 5px; margin-left: 4px; border: 1px solid var(--border); border-radius: 3px; background: var(--panel); color: var(--accent); text-decoration: none; white-space: nowrap; cursor: pointer; }
.act:hover { border-color: var(--accent); }
dialog { color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; min-width: min(28em, 90vw); }
dialog label { display: block; margin: 8px 0; }
dialog input[type=text] { width: 100%; box-sizing: border-box; }
dialog .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
#log { max-height: 8em; overflow: auto; font-family: monospace; font-size: 12px; color: var(--err); white-space: pre-wrap; margin-top: 6px; }
</style>
</head>
<body>
<header>
<h1 id="title">blescan</h1>
<a id="up" hidden>&lt; Back</a>
<a id="back" href="/debug/index.html">&lt; Back to index</a>
<span id="status">-</span>
<span id="count"></span>
</header>
<div id="req"></div>
<div class="controls">
<button id="stop">Stop</button>
<button id="pause">Pause</button>
<button id="clear">Clear</button>
<input type="text" id="filter" placeholder="Filter (substring / case insensitive)">
<label>Max rows <input type="number" id="max" value="1000" min="1"></label>
<label><input type="checkbox" id="scroll" checked> Autoscroll</label>
</div>
<div id="wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
<div id="log"></div>
<dialog id="wdlg">
<form method="dialog">
<b>Write</b> <code id="wchr"></code>
<label>Format <input type="text" id="wfmt" list="wfmts" placeholder="blank = hex bytes / utf8 / u8,u16 ..."></label>
<label>Data <input type="text" id="wdata" required placeholder="hex bytes / value(s) - comma separated"></label>
<label><input type="checkbox" id="wnoresp"> Without response</label>
<label><input type="checkbox" id="wtab"> Open in new tab</label>
<div class="buttons"><button value="cancel" formnovalidate>Cancel</button><button value="ok">Write</button></div>
</form>
</dialog>
<datalist id="wfmts">
<option value="utf8"><option value="bytes"><option value="bool"><option value="u8"><option value="u16"><option value="u32"><option value="u64">
<option value="i8"><option value="i16"><option value="i32"><option value="i64"><option value="f32"><option value="f64">
</datalist>
<script>
const ENDPOINT = {{ENDPOINT}};
const COMMANDS = {{COMMANDS}};
const $ = (id) => document.getElementById(id);

let cmd = null;
try { cmd = JSON.parse(decodeURIComponent(location.hash.slice(1))); } catch (e) {}
const name = cmd && Object.keys(cmd)[0];
// monitor returns full device list for each update
const LIST = name === 'monitor';
// scan/monitor/dump rows are devices - show enumerate link
const DEVICES = name === 'scan' || name === 'monitor' || name === 'dump';
const TREE = '\u2514\u2500 ';
// Timeout for commands started from action links (s)
const ACTION_TIMEOUT = 30;

let rows = [];      // [{ts, flat, raw, text}]
let cols = [];
let paused = false;
let ctrl = null;
let sortCol = null, sortDir = 1;
const expanded = new Set();
// Hold monitor re-render while mouse pressed (so clicks reach their target)
let holding = false;

// Flatten single-key wrapper objects ({"notification": {...}}) into type + fields
function flatten(v) {
  if (v === null || typeof v !== 'object' || Array.isArray(v)) return {value: v};
  const keys = Object.keys(v);
  if (keys.length === 1 && v[keys[0]] && typeof v[keys[0]] === 'object' && !Array.isArray(v[keys[0]])) {
    return Object.assign({type: keys[0]}, v[keys[0]]);
  }
  return v;
}

function cell(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function shortUuid(u) {
  const m = /^0000([0-9a-f]{4})-0000-1000-8000-00805f9b34fb$/i.exec(u);
  return m ? '0x' + m[1] : u;
}

function typeName(t) {
  return t ? t.replace(/^org\.bluetooth\.(service|characteristic|descriptor)\./, '') : '';
}

const SELF = location.pathname + location.search + location.hash;

// View page url for command (?back= links to current page)
function viewUrl(c) {
  return '/debug/view.html?back=' + encodeURIComponent(SELF) + '#' + encodeURIComponent(JSON.stringify(c));
}

// Record same-tab navigation so back link can use history.back()
function markNav(url) {
  try { sessionStorage.setItem('nav:' + url, '1'); } catch (e) {}
}

// Link to run command in view page (null if command not allowed)
function actionLink(label, c) {
  if (!COMMANDS.includes(Object.keys(c)[0])) return null;
  const a = el('a', 'act', label);
  a.href = viewUrl(c);
  a.onclick = (e) => {
    e.stopPropagation();
    if (e.button === 0 && !e.metaKey && !e.ctrlKey && !e.shiftKey) markNav(a.getAttribute('href'));
  };
  return a;
}

function enumerateLink(id) {
  return actionLink('enumerate', {enumerate: {read: true, device: [id], timeout: ACTION_TIMEOUT, max: 1}});
}

function charActions(row, c) {
  const props = (c.properties || '').replace(/[\[\]]/g, '').split(',');
  const has = (p) => props.includes(p);
  const base = {device: [row.flat.id], service: [c.service_uuid], characteristic: [c.uuid]};
  const e = (cmd && cmd.enumerate) || {};
  const decode = {decode: e.decode || [], decode_file: e.decode_file || []};
  const acts = [];
  if (has('Read')) {
    acts.push(actionLink('read', {enumerate: Object.assign({read: true, timeout: ACTION_TIMEOUT, max: 1}, base, decode)}));
  }
  if ((has('Write') || has('WriteNoResp')) && COMMANDS.includes('write')) {
    const b = el('button', 'act', 'write');
    b.onclick = (ev) => { ev.stopPropagation(); openWrite(row, c, !has('Write'), ev.metaKey || ev.ctrlKey); };
    acts.push(b);
  }
  if (has('Notify') || has('Indicate')) acts.push(actionLink('notify', {notify: Object.assign({}, base, decode)}));
  return acts.filter(a => a);
}

let writeTarget = null;
function openWrite(row, c, noresp, newTab) {
  writeTarget = {device: row.flat.id, service: c.service_uuid, uuid: c.uuid};
  $('wchr').textContent = shortUuid(c.uuid) + ' ' + typeName(c.characteristic_type);
  $('wnoresp').checked = noresp;
  $('wtab').checked = newTab;
  $('wdlg').showModal();
  $('wdata').focus();
}

$('wdlg').addEventListener('close', () => {
  if ($('wdlg').returnValue !== 'ok' || !writeTarget) return;
  const fmt = $('wfmt').value.trim();
  const t = writeTarget;
  const url = viewUrl({write: {
    device: [t.device], service: [t.service],
    characteristic: [t.uuid + (fmt ? '::' + fmt : '') + '=' + $('wdata').value],
    without_response: $('wnoresp').checked, timeout: ACTION_TIMEOUT,
  }});
  if ($('wtab').checked) window.open(url, '_blank');
  else { markNav(url); location.href = url; }
});

function renderServices(services, row) {
  const div = el('div');
  for (const s of Object.values(services)) {
    const sd = el('div', 'svc');
    sd.append(el('b', null, shortUuid(s.uuid)), ' ', el('span', 'muted', typeName(s.service_type)));
    div.append(sd);
    for (const c of Object.values(s.characteristics || {})) {
      const cd = el('div', 'chr');
      cd.append(el('span', 'muted', TREE), el('b', null, shortUuid(c.uuid)), ' ', typeName(c.characteristic_type), ' ',
        el('span', 'muted', c.properties || ''));
      if (c.value !== undefined && c.value !== null) cd.append(' = ' + c.value);
      if (c.decoded !== undefined && c.decoded !== null) cd.append(' ', el('b', null, JSON.stringify(c.decoded)));
      if (name === 'enumerate') cd.append(...charActions(row, c));
      div.append(cd);
    }
  }
  return div;
}

function renderManufacturer(md) {
  const div = el('div');
  for (const m of md) {
    const d = el('div');
    const id = '0x' + Number(m.id).toString(16).padStart(4, '0');
    d.append(el('span', 'muted', (m.company_name || 'Unknown') + ' (' + id + ')'), ' ' + m.data);
    div.append(d);
  }
  return div;
}

// Dump advertisement data (manufacturer_id/service_id are raw - company name from device data)
function renderAdvertisement(adv, row) {
  const div = el('div');
  for (const m of adv.manufacturer_data || []) {
    const known = (row.flat.manufacturer_data || []).find(d => d.id === m.manufacturer_id);
    renderManufacturer([{id: m.manufacturer_id, company_name: known && known.company_name, data: m.manufacturer_data}])
      .childNodes.forEach(n => div.append(n.cloneNode(true)));
  }
  for (const sd of adv.service_data || []) {
    const d = el('div');
    d.append(el('b', null, shortUuid(sd.service_id)), ' ' + sd.service_data);
    div.append(d);
  }
  return div;
}

// Returns list of nodes/strings for cell
function renderCell(c, r) {
  const v = r.flat[c];
  if (c === 'services' && v && typeof v === 'object' && !Array.isArray(v)) return [renderServices(v, r)];
  if (c === 'manufacturer_data' && Array.isArray(v)) return [renderManufacturer(v)];
  if (c === 'advertisement' && v) return [renderAdvertisement(v, r)];
  if (c === 'id' && DEVICES && v) return [String(v), enumerateLink(v)].filter(x => x);
  return [cell(v)];
}

// Dump events ({"DeviceEvent": {event_type, device, ..}}) -> device row + event fields
function flattenDump(v) {
  const e = Object.values(v)[0] || {};
  const row = {event_type: e.event_type};
  Object.assign(row, e.device || {});
  if (e.state) row.state = e.state;
  if (e.manufacturer_data) row.advertisement = {manufacturer_data: e.manufacturer_data};
  if (e.service_data) row.advertisement = {service_data: e.service_data};
  return row;
}

function makeRow(raw) {
  const flat = name === 'dump' && raw && typeof raw === 'object' && !Array.isArray(raw) ? flattenDump(raw) : flatten(raw);
  const r = {ts: new Date().toLocaleTimeString(), flat, raw};
  r.text = JSON.stringify(raw).toLowerCase();
  for (const k of Object.keys(flat)) {
    if (!cols.includes(k)) { cols.push(k); renderHead(); }
  }
  return r;
}

function match(r) {
  const f = $('filter').value.toLowerCase();
  return !f || r.text.includes(f);
}

function renderHead() {
  const head = $('head');
  head.innerHTML = '';
  const all = LIST ? cols : ['time'].concat(cols);
  for (const c of all) {
    const th = document.createElement('th');
    th.textContent = c + (c === sortCol ? (sortDir > 0 ? ' ^' : ' v') : '');
    if (LIST) {
      th.className = 'sort';
      th.onclick = () => { sortDir = sortCol === c ? -sortDir : 1; sortCol = c; renderHead(); renderAll(); };
    }
    head.append(th);
  }
}

function rowEl(r) {
  const tr = document.createElement('tr');
  tr.className = 'data';
  const vals = LIST ? [] : [[r.ts]];
  for (const c of cols) vals.push(renderCell(c, r));
  for (const v of vals) {
    const td = document.createElement('td');
    td.append(...v);
    tr.append(td);
  }
  // Click to toggle pretty JSON (monitor keeps expanded devices open across updates)
  const toggle = () => {
    const next = tr.nextSibling;
    if (next && next.classList.contains('detail')) { next.remove(); expanded.delete(r.flat.id); return; }
    if (LIST) expanded.add(r.flat.id);
    const d = document.createElement('tr');
    d.className = 'detail';
    const td = document.createElement('td');
    td.colSpan = vals.length;
    const pre = document.createElement('pre');
    pre.textContent = JSON.stringify(r.raw, null, 2);
    td.append(pre);
    d.append(td);
    tr.after(d);
  };
  tr.onclick = toggle;
  if (LIST && expanded.has(r.flat.id)) requestAnimationFrame(toggle);
  return tr;
}

function sorted(list) {
  if (!sortCol) return list;
  return list.slice().sort((a, b) => {
    const x = a.flat[sortCol], y = b.flat[sortCol];
    if (x === y) return 0;
    if (x === undefined || x === null) return 1;
    if (y === undefined || y === null) return -1;
    return (x < y ? -1 : 1) * sortDir;
  });
}

function renderAll() {
  const body = $('body');
  body.innerHTML = '';
  const shown = sorted(rows.filter(match));
  for (const r of rows) r.el = null;
  for (const r of shown) { r.el = rowEl(r); body.append(r.el); }
  updateCount(shown.length);
  autoscroll();
}

function updateCount(n) {
  if (n === undefined) n = $('body').querySelectorAll('tr.data').length;
  $('count').textContent = n + ' / ' + rows.length + (LIST ? ' devices' : ' rows');
}

function autoscroll() {
  if (!LIST && $('scroll').checked) $('wrap').scrollTop = $('wrap').scrollHeight;
}

function trim() {
  const max = Math.max(1, Number($('max').value) || 1000);
  while (rows.length > max) {
    const r = rows.shift();
    if (r.el) {
      if (r.el.nextSibling && r.el.nextSibling.classList.contains('detail')) r.el.nextSibling.remove();
      r.el.remove();
    }
  }
}

function onMessage(data) {
  let v;
  try { v = JSON.parse(data); } catch (e) { log('invalid json: ' + data); return; }
  if (LIST) {
    rows = (Array.isArray(v) ? v : [v]).map(makeRow);
    if (!paused && !holding) renderAll();
  } else {
    const r = makeRow(v);
    rows.push(r);
    trim();
    if (!paused && match(r)) {
      r.el = rowEl(r);
      $('body').append(r.el);
      autoscroll();
    }
    updateCount();
  }
}

function log(s) {
  const l = $('log');
  l.textContent += s + '\n';
  l.scrollTop = l.scrollHeight;
}

function setStatus(s, cls) {
  $('status').textContent = s;
  $('status').className = cls || '';
}

function onEvent(type, data) {
  if (type === 'message') onMessage(data);
  else if (type === 'stderr') { try { log(JSON.parse(data)); } catch (e) { log(data); } }
  else if (type === 'exit') {
    let code = null;
    try { code = JSON.parse(data).code; } catch (e) {}
    setStatus('exited (' + code + ')', code === 0 ? 'ok' : 'err');
  }
}

// Minimal SSE parser over fetch (EventSource doesnt support POST)
async function start() {
  ctrl = new AbortController();
  $('stop').textContent = 'Stop';
  setStatus('connecting');
  try {
    const resp = await fetch(ENDPOINT, {
      method: 'POST', body: JSON.stringify(cmd), signal: ctrl.signal,
      headers: {'Content-Type': 'application/json'},
    });
    if (!resp.ok) {
      setStatus('error ' + resp.status, 'err');
      log(await resp.text());
      return;
    }
    setStatus('running', 'ok');
    const reader = resp.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = '';
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += value.replace(/\r\n?/g, '\n');
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, i);
        buf = buf.slice(i + 2);
        let type = 'message', data = [];
        for (const line of block.split('\n')) {
          if (line.startsWith(':')) continue;
          const j = line.indexOf(':');
          const k = j < 0 ? line : line.slice(0, j);
          let v = j < 0 ? '' : line.slice(j + 1);
          if (v.startsWith(' ')) v = v.slice(1);
          if (k === 'event') type = v;
          else if (k === 'data') data.push(v);
        }
        if (data.length) onEvent(type, data.join('\n'));
      }
    }
    if ($('status').textContent === 'running') setStatus('closed');
  } catch (e) {
    if (e.name === 'AbortError') setStatus('stopped');
    else { setStatus('error', 'err'); log(String(e)); }
  } finally {
    ctrl = null;
    $('stop').textContent = 'Restart';
  }
}

if (!name) {
  setStatus('no command', 'err');
  $('stop').disabled = true;
} else {
  document.title = 'blescan ' + name;
  $('title').textContent = 'blescan ' + name;
  $('req').textContent = JSON.stringify(cmd);
  $('back').href = '/debug/index.html' + location.hash;
  const back = new URLSearchParams(location.search).get('back');
  if (back) {
    let sameTab = false;
    try { sameTab = sessionStorage.getItem('nav:' + SELF) === '1'; } catch (e) {}
    $('up').href = back;
    $('up').hidden = false;
    // Opened from back page in this tab - use history so browser back/forward stay consistent
    $('up').onclick = (e) => {
      if (sameTab && history.length > 1) { e.preventDefault(); history.back(); }
    };
  }
  if (LIST) { $('scroll').parentElement.hidden = true; $('max').parentElement.hidden = true; }
  renderHead();
  start();
}

$('stop').onclick = () => {
  if (ctrl) ctrl.abort();
  else { $('log').textContent = ''; start(); }
};
$('pause').onclick = () => {
  paused = !paused;
  $('pause').textContent = paused ? 'Resume' : 'Pause';
  if (!paused) renderAll();
};
$('clear').onclick = () => { rows = []; renderAll(); };
$('filter').oninput = renderAll;
$('wrap').addEventListener('mousedown', () => { holding = true; });
document.addEventListener('mouseup', () => setTimeout(() => { holding = false; }, 0));
// Action links only change the hash - reload to run new command
window.addEventListener('hashchange', () => location.reload());
$('max').onchange = () => { trim(); updateCount(); };
</script>
</body>
</html>
